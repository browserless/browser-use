name: Isolated browser startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          enable-cache: false
      - run: uv sync --dev --all-extras --python /usr/bin/python3
      - uses: actions/cache/restore@v5
        with:
          path: ~/.config/browseruse/extensions
          key: ${{ runner.os }}-browseruse-extensions-${{ hashFiles('browser_use/browser/profile.py') }}
          restore-keys: ${{ runner.os }}-browseruse-extensions-
      - name: Run only local tests without outbound networking or credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output diagnostic-home/.config/browseruse
          if [ -d "$HOME/.config/browseruse/extensions" ]; then
            cp -a "$HOME/.config/browseruse/extensions" diagnostic-home/.config/browseruse/
          fi
          google-chrome-stable --version | tee diagnostic-output/chrome-version.txt
          .venv/bin/python --version | tee diagnostic-output/python-version.txt
          # A new network namespace has no interfaces except loopback, no routes,
          # and no access to the runner host's loopback services or credentials.
          sudo unshare --net bash -euc '
            ip link set lo up
            ip -brief address
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip route show)"
            result=0
            for file in tests/ci/interactions/test_autocomplete_interaction.py tests/ci/browser/test_dom_serializer.py; do
              label=$(basename "$file" .py)
              sudo -u "$1" env -i HOME="$PWD/diagnostic-home" PATH="$PWD/.venv/bin:/usr/bin:/bin" LANG=C.UTF-8 IN_DOCKER=True ANONYMIZED_TELEMETRY=false BROWSER_USE_LOGGING_LEVEL=DEBUG PYTHONUNBUFFERED=1 DOTENV_DISABLED=1 \
                timeout --signal=TERM --kill-after=10s 240s .venv/bin/python .github/browser_diagnostic.py "$file" > "diagnostic-output/$label.log" 2>&1 || result=1
              tail -30 "diagnostic-output/$label.log"
            done
            exit "$result"
          ' bash "$(id -un)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-startup-diagnostic
          path: diagnostic-output/
          retention-days: 7
